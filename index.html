<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCAT Live Board</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --bg: #f2f4f3; --panel: #ffffff; --ink: #18201c; --muted: #5a665f; --line: #d8dfdb; --soft: #e8edea;
  --accent: #1c5d87; --good: #2b7a3e; --warn: #9a5c00; --bad: #bf3a2b; --info: #1c5d87;
  --good-bg: #e2f1e5; --warn-bg: #fbecd4; --bad-bg: #f8e0dc; --info-bg: #dfeaf3;
  --sign-bg: #101010; --sign-ink: #ffb000; --stop: #46514b; --tp: #121a16; --tiles: none;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1311; --panel: #171c19; --ink: #e3e9e5; --muted: #99a59e; --line: #2a332e; --soft: #1f2622;
    --accent: #6cb2dd; --good: #6cc07e; --warn: #f0a94a; --bad: #ef6b5e; --info: #6cb2dd;
    --good-bg: #16301f; --warn-bg: #3a2a12; --bad-bg: #3d1c19; --info-bg: #14293a;
    --stop: #a9b4ae; --tp: #e3e9e5; --tiles: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.85);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); padding-inline: 16px; padding-block: 0 32px; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
input, select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h2 { font-size: 15px; margin: 0 0 8px; text-wrap: balance; }
h3 { font-size: 13.5px; margin: 0 0 6px; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding-block: 12px 8px; }
.brand b { font-size: 18px; letter-spacing: -0.01em; }
.brand span { color: var(--muted); margin-left: 10px; }
.live { display: flex; align-items: center; gap: 8px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--good); box-shadow: 0 0 0 3px var(--good-bg); }
.dot.stale { background: var(--warn); }
.dot.err { background: var(--bad); }
.banner { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; font-size: 13px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 8px; margin-bottom: 10px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.kpi .l { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
.kpi .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.25; overflow-wrap: anywhere; }
.kpi .v.sm { font-size: 15px; padding-block: 4px; }
.kpi .s { color: var(--muted); font-size: 12px; }
.kpi svg { display: block; width: 100%; margin-top: 4px; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 12px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 1100; }
nav.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 9px 10px 7px; white-space: nowrap; color: var(--muted); }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
nav.tabs .tc { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 12px; }
.stack { display: grid; gap: 12px; }
.gap { margin-top: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.note { font-size: 12px; color: var(--muted); font-weight: 400; }
.mono { font-family: var(--mono); font-size: 11.5px; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.err { color: var(--bad); }
.tw { overflow: auto; max-width: 100%; }
.tw.tall { max-height: 520px; }
table.grid { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.grid th, table.grid td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
table.grid th { position: sticky; top: 0; background: var(--soft); font-weight: 600; white-space: nowrap; z-index: 1; }
table.grid th[data-sort] { cursor: pointer; user-select: none; }
table.grid tbody tr:hover { background: var(--soft); }
table.grid tr.sel { background: var(--info-bg); }
table.grid tr.dim td { opacity: 0.5; }
table.grid tr[data-act] { cursor: pointer; }
table.grid td.num { text-align: right; }
td.empty { color: var(--muted); text-align: center; padding: 16px; }
.tsearch { margin-bottom: 6px; width: min(320px, 100%); }
.chip { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; padding: 1px 6px; border-radius: 4px; font-weight: 700; font-size: 12px; background: var(--c, #666); color: var(--t, #fff); white-space: nowrap; }
.pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: var(--soft); color: var(--muted); }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.info { background: var(--info-bg); color: var(--info); }
.bars { display: grid; gap: 5px; }
.bar { display: grid; grid-template-columns: minmax(80px, 42%) 1fr auto; gap: 8px; align-items: center; font-size: 12.5px; }
.bar .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { display: block; background: var(--soft); border-radius: 3px; height: 12px; overflow: hidden; }
.bar .fill { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.trend svg { display: block; width: 100%; }
.hblocks { grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.hcard { text-align: left; width: 100%; cursor: pointer; }
button[aria-pressed="true"] { border-color: var(--accent); background: var(--info-bg); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; font-size: 12.5px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.mapwrap { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; }
#map { height: 72vh; min-height: 420px; border-radius: 8px; border: 1px solid var(--line); }
.side { max-height: 72vh; overflow: auto; }
.rlist label { display: flex; gap: 6px; align-items: center; padding: 2px 0; font-size: 12.5px; }
.rlist .cnt { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.side .note p { margin: 8px 0 0; }
@media (max-width: 820px) { .mapwrap { grid-template-columns: minmax(0, 1fr); } .side { max-height: none; } #map { height: 60vh; } }
.busicon { background: none; border: 0; }
.bus { position: relative; width: 28px; height: 28px; border-radius: 50%; background: var(--c); color: var(--t); display: grid; place-items: center; font: 700 10.5px/1 var(--sans); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45); }
.bus.late { border-color: #ffb300; }
.bus.vlate { border-color: #e53935; }
.bus .hd { position: absolute; inset: -10px; pointer-events: none; }
.bus .hd::before { content: ""; position: absolute; left: 50%; top: 0; transform: translateX(-50%); border-left: 5px solid transparent; border-right: 5px solid transparent; border-bottom: 8px solid var(--c); }
.signicon { background: none; border: 0; }
.signicon div { width: 18px; height: 18px; background: #111; color: #ffb000; font: 700 10px/16px var(--mono); text-align: center; border-radius: 3px; border: 1px solid #ffb000; }
.leaflet-container { background: var(--soft); font: inherit; }
.leaflet-tile-pane { filter: var(--tiles); }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--ink); }
.leaflet-popup-content { margin: 10px 12px; font-size: 12.5px; max-height: 380px; overflow: auto; min-width: 250px; }
.leaflet-control-layers { background: var(--panel); color: var(--ink); }
.signbox { background: var(--sign-bg); color: var(--sign-ink); font: 12.5px/1.55 var(--mono); padding: 10px 12px; border-radius: 6px; min-height: 60px; white-space: pre; overflow-x: auto; }
ol.line { list-style: none; margin: 0; padding: 0 0 0 22px; position: relative; }
ol.line::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 4px; background: var(--c); border-radius: 2px; }
ol.line li { position: relative; padding: 3px 0; font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
ol.line li::before { content: ""; position: absolute; left: -19px; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--panel); border: 2px solid var(--c); }
ol.line li.tp { font-weight: 600; }
ol.line li.tp::before { width: 8px; height: 8px; left: -20px; top: 7px; }
table.tt td, table.tt th { white-space: nowrap; }
table.tt th { white-space: normal; min-width: 70px; vertical-align: bottom; }
pre.json { background: var(--soft); border-radius: 6px; padding: 10px; overflow: auto; max-height: 560px; font: 11.5px/1.45 var(--mono); margin: 6px 0 0; white-space: pre; }
details > summary { cursor: pointer; }
footer { margin-top: 20px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>TCAT Live Board</b><span id="agency">Tompkins Consolidated Area Transit</span></div>
  <div class="live" aria-live="polite"><span id="dot" class="dot"></span><span id="liveText">Connecting to TCAT…</span><button type="button" id="pause" data-act="pause">Pause</button></div>
</header>
<div id="banner" class="banner" role="alert" hidden></div>
<div id="kpis" class="kpis"></div>
<nav class="tabs" id="tabs" role="tablist" aria-label="Dashboard sections"></nav>
<main>
  <section class="tab" id="tab-map" role="tabpanel">
    <div class="mapwrap">
      <div id="map"></div>
      <aside class="panel side">
        <div class="row"><b>Routes</b><button type="button" data-act="rall">All</button><button type="button" data-act="rnone">None</button><button type="button" data-act="fit">Fit TCAT area</button></div>
        <div id="rfilter" class="rlist"></div>
        <div id="mapinfo" class="note"></div>
      </aside>
    </div>
  </section>
  <section class="tab" id="tab-buses" role="tabpanel" hidden></section>
  <section class="tab" id="tab-stops" role="tabpanel" hidden></section>
  <section class="tab" id="tab-routes" role="tabpanel" hidden></section>
  <section class="tab" id="tab-alerts" role="tabpanel" hidden></section>
  <section class="tab" id="tab-history" role="tabpanel" hidden></section>
  <section class="tab" id="tab-predictions" role="tabpanel" hidden></section>
  <section class="tab" id="tab-schedule" role="tabpanel" hidden></section>
  <section class="tab" id="tab-signs" role="tabpanel" hidden></section>
  <section class="tab" id="tab-system" role="tabpanel" hidden></section>
  <section class="tab" id="tab-explorer" role="tabpanel" hidden></section>
</main>
<footer class="note">Data from TCAT through Avail InfoPoint at realtimetcatbus.availtec.com. Map tiles &copy; OpenStreetMap contributors. Polling pauses while this browser tab is hidden.</footer>
<script>
'use strict';
const BASE = 'https://realtimetcatbus.availtec.com/InfoPoint';
const TZ = 'America/New_York';

// ---------- small helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const hex = (c, d = '666666') => /^[0-9a-f]{6}$/i.test(c || '') ? c : d;
const sum = a => a.reduce((x, y) => x + (Number(y) || 0), 0);
const byNum = (a, b) => a - b;
function countBy(a, f) { const m = new Map(); for (const x of a) { const k = f(x); m.set(k, (m.get(k) || 0) + 1); } return m; }
function groupBy(a, f) { const m = new Map(); for (const x of a) { const k = f(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; }
const store = {
  get(k) { try { return localStorage.getItem('tcat.' + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('tcat.' + k, v); } catch { /* storage blocked */ } },
};

// ---------- state ----------
const S = {
  tab: 'map', paused: false, staticAt: 0, errors: new Map(),
  config: null, agency: null, routes: [], routeById: new Map(), detailById: new Map(), dirsByRoute: new Map(), dirsLoading: false,
  stops: [], stopById: new Map(), stopRoutes: new Map(), routeStops: new Map(),
  signs: [], signDeps: new Map(), headways: null, categories: null, formatted: null,
  vehicles: [], vehAt: 0, rtVeh: new Map(), rtVehHeader: null,
  tu: [], tuHeader: null, tuSel: null, rtAlerts: [], rtAlertHeader: null,
  msgCurrent: [], msgAll: [], msgHash: null, msgAt: 0, msgChangedAt: 0,
  deps: [], depsByStop: new Map(), depsAt: 0,
  stop: Number(store.get('stop')) || 165, board: null, boardAt: 0, past: null, pastAt: 0, nearest: null, stopQ: '', schedScrolled: null,
  route: Number(store.get('route')) || 30,
  hiddenRoutes: new Set((store.get('hidden') || '').split(',').filter(Boolean).map(Number)),
  history: [], trails: new Map(),
  gtfs: null, gtfsError: null, gtfsFile: 'stop_times.txt', swagger: null, kmlLines: [], kmlLoaded: false,
  explorer: { key: null, params: {}, result: null },
  hist: { index: null, days: new Map(), day: null, block: 'all', error: null, at: 0 },
};

// Values this dashboard never shows: a leaked Bitly key, sign MAC and IP addresses.
const SECRET = /^(BitlyApiKey|BitlyUsername|MAC|IP|IP_Address|AnnouncementUri|CommAddr)$/;
const HIDDEN = '[hidden by dashboard]';
function redact(x) {
  if (Array.isArray(x)) return x.map(redact);
  if (x && typeof x === 'object') {
    const o = {};
    for (const [k, v] of Object.entries(x)) o[k] = SECRET.test(k) && v ? HIDDEN : redact(v);
    if (typeof o.Name === 'string' && SECRET.test(o.Name) && o.Value) o.Value = HIDDEN;
    return o;
  }
  return x;
}

// ---------- fetch with per-endpoint stats ----------
const stats = new Map();
async function get(path, type = 'json', key) {
  const url = /^https?:/.test(path) ? path : BASE + path;
  key = key || path.replace(/\?.*$/, '');
  const st = stats.get(key) || { key, n: 0, err: 0 };
  stats.set(key, st);
  st.url = url;
  const t0 = performance.now();
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 45000);
  try {
    const r = await fetch(url, { signal: ctl.signal, cache: 'no-store' });
    const buf = await r.arrayBuffer();
    st.status = r.status;
    st.bytes = buf.byteLength;
    if (!r.ok) throw new Error(`HTTP ${r.status} from ${key}`);
    let out = buf;
    if (type !== 'buf') { out = new TextDecoder().decode(buf); if (type === 'json') out = JSON.parse(out); }
    st.n++;
    st.error = null;
    return out;
  } catch (e) {
    st.err++;
    st.error = e.name === 'AbortError' ? `Timed out after 45 s: ${key}` : e.message;
    throw new Error(st.error);
  } finally {
    clearTimeout(timer);
    st.ms = Math.round(performance.now() - t0);
    st.at = Date.now();
  }
}

// ---------- time ----------
function msd(s) {
  const m = typeof s === 'string' ? /\/Date\((-?\d+)([+-]\d{4})?\)\//.exec(s) : null;
  if (!m) return null;
  const off = m[2] ? (m[2][0] === '-' ? -1 : 1) * (Number(m[2].slice(1, 3)) * 60 + Number(m[2].slice(3, 5))) : 0;
  return { ms: Number(m[1]), off };
}
const toMs = s => msd(s)?.ms ?? null;
function wall(s) {
  const d = msd(s);
  if (!d) return null;
  const w = new Date(d.ms + d.off * 60000);
  return { y: w.getUTCFullYear(), mo: w.getUTCMonth() + 1, d: w.getUTCDate(), h: w.getUTCHours(), mi: w.getUTCMinutes() };
}
const F = {
  t: new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }),
  ts: new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit', second: '2-digit' }),
  dt: new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }),
};
const fmt = (f, v) => v == null || !isFinite(v) ? '' : F[f].format(v);
const clock = (h, mi) => `${(h % 12) || 12}:${String(mi).padStart(2, '0')} ${h % 24 < 12 ? 'AM' : 'PM'}`;
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const wallClock = s => { const w = wall(s); return w ? clock(w.h, w.mi) : ''; };
const wallDate = s => { const w = wall(s); return w ? `${MONTHS[w.mo - 1]} ${w.d}, ${w.y}` : ''; };
// GTFS times are not zero-padded ("7:00:00") and run past 24:00, so always parse to seconds.
const gsec = t => { const p = String(t).split(':'); return Number(p[0]) * 3600 + Number(p[1]) * 60 + (Number(p[2]) || 0); };
const gclock = s => clock(Math.floor(s / 3600), Math.floor((s % 3600) / 60));
function ago(t) {
  if (!t) return 'not yet';
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)}m ${s % 60}s ago`;
  return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m ago`;
}
const untilMin = t => t == null ? null : Math.round((t - Date.now()) / 60000);
const inMin = t => { const m = untilMin(t); return m == null ? '' : m <= 0 ? 'Due' : `${m} min`; };
function fmtDelay(s) {
  if (s == null) return '';
  if (!s) return 'on time';
  const a = Math.abs(s);
  return `${s > 0 ? '+' : '-'}${Math.floor(a / 60)}m ${a % 60}s`;
}
function nyNow() {
  const p = {};
  for (const x of new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).formatToParts(new Date())) p[x.type] = x.value;
  return { y: +p.year, mo: +p.month, d: +p.day, h: +p.hour % 24, mi: +p.minute, s: +p.second };
}
const WD = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
function serviceDay() {
  const n = nyNow();
  let date = new Date(Date.UTC(n.y, n.mo - 1, n.d));
  let secs = n.h * 3600 + n.mi * 60 + n.s;
  if (n.h < 3) { date = new Date(date.getTime() - 86400000); secs += 86400; }
  return { ymd: date.toISOString().slice(0, 10).replace(/-/g, ''), dow: date.getUTCDay(), secs };
}
function activeServices(day) {
  const G = S.gtfs, set = new Set();
  if (!G) return set;
  for (const c of G.calendar) if (c[WD[day.dow]] === '1' && c.start_date <= day.ymd && day.ymd <= c.end_date) set.add(c.service_id);
  for (const x of G.calendarDates) if (x.date === day.ymd) { if (x.exception_type === '1') set.add(x.service_id); else set.delete(x.service_id); }
  return set;
}

// ---------- domain helpers ----------
const route = id => S.routeById.get(Number(id));
const routeName = r => (r?.IvrDescription || r?.LongName || '').replace(/^Route\s+\S+\s+-\s+/, '');
const stopName = id => S.stopById.get(Number(id))?.Name ?? `Stop ${id}`;
function chip(id, extra = '') {
  const r = route(id);
  if (!r) return `<span class="chip">${esc(id)}${extra}</span>`;
  const bg = hex(r.Color);
  let fg = hex(r.TextColor, 'ffffff');
  // The hidden deadhead route has white text on white, so pick a readable text color.
  if (fg.toLowerCase() === bg.toLowerCase()) fg = parseInt(bg.slice(0, 2), 16) * 0.3 + parseInt(bg.slice(2, 4), 16) * 0.59 + parseInt(bg.slice(4), 16) * 0.11 > 150 ? '000000' : 'ffffff';

    // A forced run during a fetch (for example a new stop picked) runs again right after it.
    if (p.busy) { if (force === true) p.again = true; return; }
    clearTimeout(p.timer);
    if ((force === true || (!S.paused && !document.hidden)) && when()) {
      p.busy = true;
      try { await fn(); p.ok = true; p.error = null; }
      catch (e) { p.ok = false; p.error = e.message; console.warn(name, e); }
      p.busy = false;
      p.last = Date.now();
      if (p.again) { p.again = false; p.run(true); return; }

async function loadGtfs() {
  try {
    const buf = await get('/GTFS-Zip.ashx', 'buf', 'GTFS-Zip.ashx');
    const zip = await JSZip.loadAsync(buf);
    const G = { files: {} };
    for (const f of Object.values(zip.files)) {
      if (f.dir) continue;
      const text = await f.async('string');
      const rows = parseCSV(text);
      G.files[f.name] = { header: rows[0] || [], rows: rows.slice(1), bytes: text.length };
    }
    const O = n => G.files[n] ? objs(G.files[n].header, G.files[n].rows) : [];

    G.feedInfo = O('feed_info.txt')[0] || {};
    G.calendar = O('calendar.txt');
    G.calendarDates = O('calendar_dates.txt');
    G.fares = O('fare_attributes.txt');
    G.transfers = O('transfers.txt');
    G.frequencies = O('frequencies.txt');
    G.trips = new Map(O('trips.txt').map(t => [t.trip_id, t]));
    const st = G.files['stop_times.txt'];
    const ix = Object.fromEntries(st.header.map((h, i) => [h, i]));
    G.byTrip = new Map();
    G.byStop = new Map();
    for (const r of st.rows) {
      const e = { trip: r[ix.trip_id], stop: r[ix.stop_id], arr: gsec(r[ix.arrival_time]), dep: gsec(r[ix.departure_time]), seq: Number(r[ix.stop_sequence]), tp: r[ix.timepoint] === '1' };

      G.byTrip.get(e.trip).push(e);
      if (!G.byStop.has(e.stop)) G.byStop.set(e.stop, []);
      G.byStop.get(e.stop).push(e);
    }
    for (const a of G.byTrip.values()) a.sort((x, y) => x.seq - y.seq);
    for (const a of G.byStop.values()) a.sort((x, y) => x.dep - y.dep);
    const sh = G.files['shapes.txt'];
    const si = Object.fromEntries(sh.header.map((h, i) => [h, i]));
    const tmp = new Map();
    for (const r of sh.rows) {
      const id = r[si.shape_id];
      if (!tmp.has(id)) tmp.set(id, []);
      tmp.get(id).push([Number(r[si.shape_pt_sequence]), Number(r[si.shape_pt_lat]), Number(r[si.shape_pt_lon])]);
    }
    G.shapes = new Map([...tmp].map(([id, pts]) => [id, pts.sort((a, b) => a[0] - b[0]).map(p => [p[1], p[2]])]));

    for (const t of G.trips.values()) {

}

function flatDeps(b) {

// ---------- Routes ----------
function gtfsRouteDay() {
  const G = S.gtfs;
  if (!G) return null;
  const day = serviceDay();
  if (G._day?.ymd === day.ymd) return G._day;
  const svc = activeServices(day), per = new Map();
  for (const t of G.trips.values()) {
    if (!svc.has(t.service_id)) continue;
    const st = G.byTrip.get(t.trip_id);
    if (!st?.length) continue;
    const x = per.get(t.route_id) || { n: 0, first: Infinity, last: -Infinity };
    x.n++;
    x.first = Math.min(x.first, st[0].dep);
    x.last = Math.max(x.last, st[st.length - 1].arr);
    per.set(t.route_id, x);
  }
  G._day = { ymd: day.ymd, per };
  return G._day;
}
function busStopIndex(v, stops) {
  const rt = S.rtVeh.get(String(v.VehicleId));
  const rtStop = Number(rt?.StopId);
  if (rtStop && stops.includes(rtStop)) return { i: stops.indexOf(rtStop), how: RT_STATUS[rt.CurrentStatus] || 'At' };
  if (v.StopId && stops.includes(v.StopId)) return { i: stops.indexOf(v.StopId), how: 'At' };
  const i = stops.findIndex(id => stopName(id) === v.LastStop);
  return i >= 0 ? { i, how: 'Passed' } : null;
}
function timetable(r) {
  const G = S.gtfs;
  if (!G) return `<p class="muted">${S.gtfsError ? esc('The GTFS schedule failed to load: ' + S.gtfsError) : 'Loading the GTFS schedule…'}</p>`;
  const day = serviceDay(), svc = activeServices(day);
  const trips = [...G.trips.values()].filter(t => t.route_id === String(r.RouteId) && svc.has(t.service_id));
  if (!trips.length) return '<p class="muted">No trips are scheduled today.</p>';
  return ['0', '1'].map(dir => {
    const ts = trips.filter(t => t.direction_id === dir).map(t => {
      const seen = new Map();
      const st = (G.byTrip.get(t.trip_id) || []).filter(x => x.tp).map(x => {
        const n = seen.get(x.stop) || 0;
        seen.set(x.stop, n + 1);
        return { ...x, key: `${x.stop}:${n}` };
      });
      return { t, st };
    }).filter(x => x.st.length).sort((a, b) => a.st[0].dep - b.st[0].dep);
    if (!ts.length) return '';
    const pos = new Map();
    for (const { st } of ts) st.forEach((x, i) => { if (!pos.has(x.key)) pos.set(x.key, []); pos.get(x.key).push(st.length > 1 ? i / (st.length - 1) : 0); });
    const order = [...pos].map(([k, ps]) => [k, ps.sort(byNum)[ps.length >> 1]]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
    const now = day.secs;
    const rows = ts.map(({ t, st }) => {
      const live = st[0].dep <= now && now <= st[st.length - 1].arr, gone = st[st.length - 1].arr < now;
      const at = new Map(st.map(x => [x.key, x]));
      return `<tr class="${live ? 'sel' : gone ? 'dim' : ''}"><td>${esc(t.trip_headsign)}</td>${order.map(k => `<td class="num">${at.has(k) ? esc(gclock(at.get(k).dep)) : ''}</td>`).join('')}<td class="mono muted">${esc(t.trip_id)}</td></tr>`;
    }).join('');
    const head = order.map(k => { const [id, n] = k.split(':'); return `<th title="Stop #${esc(id)}">${esc(stopName(id))}${n !== '0' ? ' again' : ''}</th>`; }).join('');
    return `<h3 class="gap">Direction ${dir} · ${ts.length} trips</h3><div class="tw tall" data-k="tt${r.RouteId}-${dir}"><table class="grid tt"><thead><tr><th>Headsign</th>${head}<th>GTFS trip</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join('');
}
function routeDetail(r) {
  const byDir = S.routeStops.get(r.RouteId) || new Map();
  const dirs = S.dirsByRoute.get(r.RouteId) || [];
  const buses = S.vehicles.filter(v => v.RouteId === r.RouteId);
  const diag = [...byDir].map(([dir, stops]) => {
    const at = new Map(), lost = [];
    for (const v of buses.filter(x => x.Direction === dir)) {
      const p = busStopIndex(v, stops);
      if (!p) { lost.push(v); continue; }
      if (!at.has(p.i)) at.set(p.i, []);
      at.get(p.i).push({ v, how: p.how });
    }
    const label = dirs.find(d => d.Dir === dir)?.DirectionDesc || dir;
    const items = stops.map((id, i) => {
      const s = S.stopById.get(id);
      const here = (at.get(i) || []).map(({ v, how }) => `<span class="pill info">${esc(how)}: bus ${esc(v.Name)}</span>${statusPill(v)}${occPill(v)}`).join('');
      return `<li class="${s?.IsTimePoint ? 'tp' : ''}"><a href="#" data-act="stop" data-id="${id}">${esc(s?.Name ?? id)}</a>${here}</li>`;
    }).join('');
    return `<div class="panel"><h3>${esc(label)} <span class="note">code ${esc(dir)} · ${stops.length} stops · bold stops are timepoints</span></h3><ol class="line" style="--c:#${hex(r.Color)}">${items}</ol>${lost.length ? `<p class="note">Not placed on the line: ${lost.map(v => esc(v.Name)).join(', ')}</p>` : ''}</div>`;
  }).join('');
  const other = buses.filter(v => !byDir.has(v.Direction));
  return `<div class="panel gap"><div class="row">${chip(r.RouteId)}<h2 style="margin:0">${esc(routeName(r))}</h2><span class="pill">${buses.length} live bus${buses.length === 1 ? '' : 'es'}</span><button type="button" data-act="maproute" data-id="${r.RouteId}">Show only this route on the map</button></div>
      <p class="small muted">${esc(r.GoogleDescription)} · RouteId ${r.RouteId} · record ${esc(r.RouteRecordId)} · KML ${esc(r.RouteTraceFilename)}</p></div>
    <div class="grid2 gap">${diag || '<p class="muted">No stop list for this route.</p>'}</div>
    ${other.length ? `<p class="note">Buses with other direction codes: ${other.map(v => esc(`${v.Name} ${v.Direction}`)).join(', ')}</p>` : ''}
    <div class="panel gap"><h2>Today's timetable <span class="note">GTFS timepoints, one row per trip. Highlighted rows are running now. Dimmed rows are finished.</span></h2>${timetable(r)}</div>`;
}

const RUNS_PER_BLOCK = 36;

const histBlank = () => ({
  v: { n: 0, late: 0, early: 0, devSum: 0, devMax: 0, onSum: 0, onMax: 0, capSum: 0, loadMax: 0, occ: [0, 0, 0, 0, 0, 0, 0] },
  d: { n: 0, onTime: 0, late: 0, early: 0, delaySum: 0, delayMax: 0 },
  trips: new Set(),
});
function histMerge(into, s) {
  for (const k of ['n', 'late', 'early', 'devSum', 'onSum', 'capSum']) into.v[k] += s.v?.[k] || 0;
  for (const k of ['devMax', 'onMax', 'loadMax']) into.v[k] = Math.max(into.v[k], s.v?.[k] || 0);
  (s.v?.occ || []).forEach((n, i) => { into.v.occ[i] += n; });
  for (const k of ['n', 'onTime', 'late', 'early', 'delaySum']) into.d[k] += s.d?.[k] || 0;
  into.d.delayMax = Math.max(into.d.delayMax, s.d?.delayMax || 0);
  for (const t of s.trips || []) into.trips.add(t);
}
function histAgg(day, names) {
  const out = { all: histBlank(), routes: new Map(), runs: 0, busSum: 0, busMax: 0 };
  for (const name of names) {
    const b = day?.blocks?.[name];
    if (!b) continue;
    out.runs += b.runs;
    out.busSum += b.busSum;
    out.busMax = Math.max(out.busMax, b.busMax);
    for (const [rid, s] of Object.entries(b.routes)) {
      if (!out.routes.has(rid)) out.routes.set(rid, histBlank());

// Scheduled trips per route and 6-hour block on a calendar date, by trip start time.
// Trips that start after midnight belong to the previous day's service.
function scheduledTrips(date) {
  const G = S.gtfs;
  if (!G) return null;
  G._sched = G._sched || new Map();
  if (G._sched.has(date)) return G._sched.get(date);
  const out = new Map();
  const add = (rid, sec) => { const b = String(Math.floor(sec / 21600) * 6); const m = out.get(rid) || {}; m[b] = (m[b] || 0) + 1; out.set(rid, m); };
  const [y, mo, d] = date.split('-').map(Number);
  const on = new Date(Date.UTC(y, mo - 1, d)), before = new Date(on.getTime() - 86400000);
  const asDay = dt => ({ ymd: dt.toISOString().slice(0, 10).replace(/-/g, ''), dow: dt.getUTCDay() });
  const today = activeServices(asDay(on)), yesterday = activeServices(asDay(before));

  for (const t of G.trips.values()) {
    const start = G.byTrip.get(t.trip_id)?.[0]?.dep;
    if (start == null) continue;
    if (today.has(t.service_id) && start < 86400) add(t.route_id, start);

const share = (a, b) => b ? `${Math.round(100 * a / b)}%` : '';

    return;
  }
  const date = S.hist.day, day = S.hist.days.get(date);
  const sched = scheduledTrips(date);
  const schedFor = (rid, names) => sched ? names.reduce((n, b) => n + (sched.get(String(rid))?.[b] || 0), 0) : null;
  const schedAll = names => sched ? [...sched.keys()].reduce((n, rid) => n + schedFor(rid, names), 0) : null;
  const card = ([name, label]) => {
    const a = histAgg(day, [name]), d = a.all.d, v = a.all.v;
    const sch = schedAll([name]);
    const tone = !d.n ? '' : d.onTime / d.n >= 0.8 ? 'good' : d.onTime / d.n >= 0.6 ? 'warn' : 'bad';
    return `<button type="button" class="panel kpi hcard" data-act="hblock" data-id="${name}" aria-pressed="${S.hist.block === name}">
      <div class="l">${esc(label)}</div>
      <div class="v">${d.n ? `<span class="pill ${tone}" style="font-size:18px">${share(d.onTime, d.n)} on time</span>` : '<span class="muted">No data</span>'}</div>
      <dl class="kv" style="margin-top:6px">
        <dt>Departures</dt><dd>${d.n} measured${d.n ? ` · average ${esc(fmtDelay(Math.round(d.delaySum / d.n)))}` : ''}</dd>
        <dt>Buses</dt><dd>${a.runs ? `${(a.busSum / a.runs).toFixed(1)} average · ${a.busMax} max` : 'none recorded'}</dd>
        <dt>Late buses</dt><dd>${v.n ? `${share(v.late, v.n)} of samples` : ''}</dd>
        <dt>Riders per bus</dt><dd>${v.n ? `${(v.onSum / v.n).toFixed(1)} · max load ${Math.round(100 * v.loadMax)}%` : ''}</dd>
        <dt>Trips run</dt><dd>${a.all.trips.size} seen${sch != null ? ` of ${sch} scheduled` : ''}</dd>
        <dt>Coverage</dt><dd>${a.runs} of ${RUNS_PER_BLOCK} snapshots</dd>
      </dl></button>`;

  const names = S.hist.block === 'all' ? BLOCKS.map(b => b[0]) : [S.hist.block];
  const agg = histAgg(day, names);
  const rows = [...agg.routes].map(([rid, s]) => ({ rid, s, sched: schedFor(rid, names) }));
  if (sched) for (const [rid] of sched) if (!agg.routes.has(rid) && schedFor(rid, names)) rows.push({ rid, s: histBlank(), sched: schedFor(rid, names) });
  const cols = [
    { h: 'Route', k: r => route(r.rid)?.SortOrder ?? 999, f: r => chip(r.rid) },
    { h: 'On time', k: r => r.s.d.n ? r.s.d.onTime / r.s.d.n : null, f: r => share(r.s.d.onTime, r.s.d.n), c: 'num' },
    { h: 'Departures', k: r => r.s.d.n, c: 'num' },
    { h: 'Early', k: r => r.s.d.early, c: 'num' },
    { h: 'Late', k: r => r.s.d.late, c: 'num' },
    { h: 'Average delay', k: r => r.s.d.n ? r.s.d.delaySum / r.s.d.n : null, f: r => r.s.d.n ? esc(fmtDelay(Math.round(r.s.d.delaySum / r.s.d.n))) : '' },
    { h: 'Worst delay', k: r => r.s.d.n ? r.s.d.delayMax : null, f: r => r.s.d.n ? esc(fmtDelay(r.s.d.delayMax)) : '' },
    { h: 'Late bus samples', k: r => r.s.v.n ? r.s.v.late / r.s.v.n : null, f: r => share(r.s.v.late, r.s.v.n), c: 'num' },
    { h: 'Riders per bus', k: r => r.s.v.n ? r.s.v.onSum / r.s.v.n : null, f: r => r.s.v.n ? (r.s.v.onSum / r.s.v.n).toFixed(1) : '', c: 'num' },
    { h: 'Most riders', k: r => r.s.v.onMax, c: 'num' },
    { h: 'Max load', k: r => r.s.v.loadMax, f: r => r.s.v.n ? `${Math.round(100 * r.s.v.loadMax)}%` : '', c: 'num' },
    { h: 'Trips seen', k: r => r.s.trips.size, c: 'num' },
    { h: 'Trips scheduled', k: r => r.sched, c: 'num' },
  ];
  const trendCols = [
    { h: 'Day', k: 'date', f: x => `${esc(dayLabel(x.date))}${x.date === date ? ' <span class="pill info">shown</span>' : ''}` },
    { h: 'On time', k: 'onTime', f: x => x.onTime == null ? '' : `${Math.round(100 * x.onTime)}%`, c: 'num' },
    { h: 'Departures', k: 'departures', c: 'num' },
    { h: 'Average delay', k: 'avgDelay', f: x => x.avgDelay == null ? '' : esc(fmtDelay(x.avgDelay)) },
    { h: 'Buses', k: 'busAvg', c: 'num' },
    { h: 'Late bus samples', k: 'lateShare', f: x => x.lateShare == null ? '' : `${Math.round(100 * x.lateShare)}%`, c: 'num' },
    { h: 'Riders per bus', k: 'ridersAvg', c: 'num' },
    { h: 'Trips seen', k: 'trips', c: 'num' },
    { h: 'Alerts', k: 'alerts', c: 'num' },
    { h: 'Snapshots', k: 'runs', c: 'num' },
  ];
  const alerts = Object.entries(day?.alerts || {}).sort((a, b) => a[1].first - b[1].first);
  const otp = days.filter(x => x.onTime != null);
  sec.innerHTML = `
    <div class="panel"><div class="row"><h2 style="margin:0">History</h2>
      <label for="hday" class="small">Day</label><select id="hday">${[...days].reverse().map(x => `<option value="${esc(x.date)}"${x.date === date ? ' selected' : ''}>${esc(dayLabel(x.date))}</option>`).join('')}</select>
      <span class="note">Updated ${esc(ago(S.hist.index?.updated))}</span></div>
      <p class="note">A GitHub Action records TCAT every 10 minutes, starting ${esc(dayLabel(days[0].date))}. On time means a bus left a timepoint no more than 1 minute early or 5 minutes late. Rider numbers come from on-board passenger counts. Trips seen counts trips that left at least one timepoint while the recorder was running.</p></div>
    ${day ? `<div class="grid2 gap hblocks">${BLOCKS.map(card).join('')}</div>
    <div class="panel gap"><div class="row"><h2 style="margin:0">By route</h2>
      <button type="button" data-act="hblock" data-id="all" aria-pressed="${S.hist.block === 'all'}">Whole day</button>
      ${BLOCKS.map(([n, l]) => `<button type="button" data-act="hblock" data-id="${n}" aria-pressed="${S.hist.block === n}">${esc(l)}</button>`).join('')}</div>
      <p class="note">${esc(dayLabel(date))}, ${S.hist.block === 'all' ? 'whole day' : esc(BLOCKS.find(b => b[0] === S.hist.block)[1])}: ${share(agg.all.d.onTime, agg.all.d.n) || 'no'} on time across ${agg.all.d.n} timepoint departures.</p>
      ${table('hroutes', rows, cols, { sort: 0, empty: 'No data for this block.' })}</div>
    <div class="panel gap"><h2>Alerts in effect · ${alerts.length}</h2>${alerts.length ? `<div class="stack" style="gap:8px">${alerts.map(([id, a]) => `<div><div class="row"><span class="pill">${esc(a.cause)}</span><span class="pill">${esc(a.effect)}</span><span class="note">Message ${esc(id)} · first recorded ${esc(fmt('t', a.first))}</span></div><div class="small" style="margin-top:2px">${esc(a.message || a.header)}</div></div>`).join('')}</div>` : '<p class="muted small">None recorded.</p>'}</div>`
    : '<p class="muted gap">Loading this day…</p>'}
    <div class="panel gap"><h2>Every recorded day</h2>${otp.length > 1 ? `<div class="trend small">On time by day${spark(otp.map(x => 100 * x.onTime), 'var(--good)', 40)}</div>` : ''}
      ${table('hdays', [...days].reverse(), trendCols, { attrs: x => `data-act="hday" data-id="${esc(x.date)}"${x.date === date ? ' class="sel"' : ''}` })}</div>`;
}

// ---------- tabs ----------
const TABS = [['map', 'Map'], ['buses', 'Buses'], ['stops', 'Stops & departures'], ['routes', 'Routes'], ['alerts', 'Alerts'], ['history', 'History'], ['predictions', 'Predictions'], ['schedule', 'Schedule'], ['signs', 'Signs'], ['system', 'System'], ['explorer', 'API explorer']];
const RENDER = { map: renderMapPanel, buses: renderBuses, stops: renderStops, routes: renderRoutes, alerts: renderAlerts, history: renderHistory, predictions: renderPredictions, schedule: renderSchedule, signs: renderSigns, system: renderSystem, explorer: renderExplorer };
function buildNav() {
  $('#tabs').innerHTML = TABS.map(([id, label]) => `<button type="button" role="tab" id="tb-${id}" data-act="tab" data-id="${id}" aria-controls="tab-${id}" aria-selected="false">${esc(label)}<span class="tc" id="tc-${id}"></span></button>`).join('');
}
function showTab(id) {
  if (!RENDER[id]) id = 'map';
  S.tab = id;
  for (const [t] of TABS) { $('#tab-' + t).hidden = t !== id; $('#tb-' + t).setAttribute('aria-selected', String(t === id)); }
  try { history.replaceState(null, '', '#' + id); } catch { /* some browsers block this for files opened from disk */ }
  renderTab();
  if (id === 'map') setTimeout(() => map.invalidateSize(), 0);
  if (id === 'stops') { P.stopBoard?.run(true); P.stopPast?.run(true); if (Date.now() - S.depsAt > 90000) P.allDepartures?.run(true); }
  if (id === 'signs') P.signs?.run(true);
  if (id === 'history') P.history?.run(true);
  if (id === 'routes') loadDirections();
}
function rerender(tabs) {
  if (tabs && !tabs.includes(S.tab)) return;
  const a = document.activeElement;
  if (a && a.matches('#stopq, #tab-explorer input, #tab-explorer select')) return;
  renderTab();
}
function renderTab() {
  const sec = $('#tab-' + S.tab);
  if (!sec) return;
  if (!S.staticAt && S.tab !== 'map') { sec.innerHTML = '<p class="muted">Loading TCAT data…</p>'; return; }
  const a = document.activeElement, fid = a && sec.contains(a) ? a.id : null;
  const sel = fid && typeof a.selectionStart === 'number' ? [a.selectionStart, a.selectionEnd] : null;
  const scroll = new Map([...sec.querySelectorAll('.tw[data-k]')].map(e => [e.dataset.k, [e.scrollLeft, e.scrollTop]]));
  const open = new Set([...sec.querySelectorAll('details[data-k]')].filter(d => d.open).map(d => d.dataset.k));
  const y = window.scrollY;
  RENDER[S.tab]();
  for (const e of sec.querySelectorAll('.tw[data-k]')) { const s = scroll.get(e.dataset.k); if (s) { e.scrollLeft = s[0]; e.scrollTop = s[1]; } }
  for (const d of sec.querySelectorAll('details[data-k]')) if (open.has(d.dataset.k)) d.open = true;
  if (fid) {
    const n = document.getElementById(fid);
    if (n) { n.focus({ preventScroll: true }); if (sel) { try { n.setSelectionRange(sel[0], sel[1]); } catch { /* not a text input */ } } }
  }
  if (Math.abs(window.scrollY - y) > 2) window.scrollTo(0, y);
  if (S.tab === 'stops') scrollSched();
}

// ---------- actions ----------
function selectStop(id) {
  if (!S.stopById.has(id)) return;
  S.stop = id;
  store.set('stop', id);
  S.board = null;
  S.past = null;
  map.closePopup();
  if (S.tab !== 'stops') showTab('stops');
  else { renderTab(); P.stopBoard?.run(true); P.stopPast?.run(true); }
  window.scrollTo(0, 0);
}
function showStopOnMap(id) {
  const s = S.stopById.get(id);
  if (!s) return;
  showTab('map');
  setTimeout(() => { map.setView([s.Latitude, s.Longitude], 17); openStopPopup(s); }, 50);
}
function showBus(id) {
  const v = S.vehicles.find(x => x.VehicleId === id);
  if (v && S.hiddenRoutes.has(v.RouteId)) { S.hiddenRoutes.delete(v.RouteId); applyRouteFilter(); }
  showTab('map');
  setTimeout(() => { const m = vMarkers.get(id); if (m) { map.setView(m.getLatLng(), 16); m.openPopup(); } }, 50);
}
async function nearest() {
  const c = map.getCenter();
  try { S.nearest = await get(`/rest/Stops/Nearest?latitude=${c.lat.toFixed(6)}&longitude=${c.lng.toFixed(6)}&take=8`, 'json', 'Stops/Nearest'); }
  catch { S.nearest = []; }
  renderTab();
}
function togglePause() {
  S.paused = !S.paused;
  $('#pause').textContent = S.paused ? 'Resume' : 'Pause';
  if (!S.paused) catchUp();
}
function sortBy(th) {
  const st = TS[th.dataset.sort];
  const i = Number(th.dataset.i);
  if (st.sort === i) st.dir = -st.dir; else { st.sort = i; st.dir = 1; }
  renderTab();
}
document.addEventListener('click', e => {
  const th = e.target.closest('th[data-sort]');
  if (th) { sortBy(th); return; }
  if (e.target.closest('summary')) return;
  const a = e.target.closest('[data-act]');
  if (!a) return;
  if (a.tagName === 'A') e.preventDefault();
  const id = a.dataset.id;
  switch (a.dataset.act) {
    case 'tab': map.closePopup(); showTab(id); break;
    case 'pause': togglePause(); break;
    case 'stop': selectStop(Number(id)); break;
    case 'showstop': showStopOnMap(Number(id)); break;
    case 'bus': showBus(Number(id)); break;
    case 'route': S.route = Number(id); store.set('route', id); renderTab(); break;
    case 'maproute': S.hiddenRoutes = new Set(S.routes.map(r => r.RouteId).filter(r => r !== Number(id))); applyRouteFilter(); showTab('map'); break;
    case 'rall': S.hiddenRoutes.clear(); applyRouteFilter(); break;
    case 'rnone': S.hiddenRoutes = new Set(S.routes.map(r => r.RouteId)); applyRouteFilter(); break;
    case 'fit': fitTcat(); break;
    case 'nearest': nearest(); break;
    case 'tu': S.tuSel = id; renderTab(); break;
    case 'exrun': runExplorer(); break;
    case 'hblock': S.hist.block = id; renderTab(); break;
    case 'hday': selectHistoryDay(id); break;
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('th[data-sort]')) { e.preventDefault(); sortBy(e.target); }
  else if (e.key === 'Enter' && e.target.matches('[data-exp]')) runExplorer();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.q) {
    TS[t.dataset.q].q = t.value;
    const needle = t.value.trim().toLowerCase();
    const tb = t.nextElementSibling?.querySelector('tbody');
    if (tb) for (const tr of tb.rows) tr.hidden = !!needle && !tr.textContent.toLowerCase().includes(needle);
  } else if (t.id === 'stopq') S.stopQ = t.value;
  else if (t.dataset.exp) S.explorer.params[`${S.explorer.key}:${t.dataset.exp}`] = t.value;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.route) {
    const id = Number(t.dataset.route);
    if (t.checked) S.hiddenRoutes.delete(id); else S.hiddenRoutes.add(id);
    applyRouteFilter();
  } else if (t.id === 'stopq') {
    const m = /#(\d+)\s*$/.exec(t.value) || /^\s*(\d+)\s*$/.exec(t.value);
    if (m && S.stopById.has(Number(m[1]))) { S.stopQ = ''; t.blur(); selectStop(Number(m[1])); }
  } else if (t.id === 'gfile') { S.gtfsFile = t.value; renderTab(); }
  else if (t.id === 'exsel') { S.explorer.key = t.value; S.explorer.result = null; t.blur(); renderTab(); }
  else if (t.id === 'hday') { t.blur(); selectHistoryDay(t.value); }
});

// ---------- live status line ----------
let tick = 0;
setInterval(() => {
  tick++;
  const p = P.vehicles, age = S.vehAt ? Date.now() - S.vehAt : Infinity;
  $('#dot').className = 'dot ' + (S.paused ? '' : p?.ok === false ? 'err' : age < 30000 ? 'ok' : 'stale');
  $('#liveText').textContent = S.paused ? 'Paused. Press Resume to continue.'
    : p?.ok === false ? `Bus feed error: ${p.error}. Retrying every ${p.every / 1000} s.`
    : S.vehAt ? `Buses updated ${ago(S.vehAt)} · next in ${Math.max(0, Math.round((p.next - Date.now()) / 1000))} s`
    : 'Connecting to TCAT…';
  if (S.tab === 'system' && tick % 5 === 0) rerender(['system']);
}, 1000);

// ---------- boot ----------
async function boot() {
  buildNav();
  initMap();
  showTab((location.hash || '').slice(1) || 'map');
  await loadStatic();
  afterStatic();
  maybeFit();
  poller('vehicles', (Number(S.config?.VehicleRefreshInterval) || 10) * 1000, pollVehicles);
  poller('gtfsRtVehicles', 15000, pollRtVehicles);
  poller('tripUpdates', 30000, pollTripUpdates);
  poller('gtfsRtAlerts', 60000, pollRtAlerts);
  poller('messages', 30000, pollMessages);
  poller('allDepartures', 90000, pollDeps, () => S.tab === 'stops' || Date.now() - S.depsAt > 300000);
  poller('stopBoard', 20000, pollBoard, () => S.tab === 'stops' && !!S.stop);
  poller('stopPast', 60000, pollPast, () => S.tab === 'stops' && !!S.stop);
  poller('signs', 30000, pollSigns, () => S.tab === 'signs');
  poller('history', 600000, loadHistory, () => S.tab === 'history');
  const st = poller('static', 1800000, async () => { await loadStatic(); afterStatic(); });
  // The first load runs even in a hidden tab, so the page is filled in when someone opens it.
  for (const p of Object.values(P)) if (p !== st) p.run(true);
  st.next = Date.now() + st.every;
  st.timer = setTimeout(st.run, st.every);
  loadGtfs();
  loadSwagger();
}
boot();
</script>
